<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Ficha: 4 módulos, 14 de 14 autotests, 3 dominios, 0 datos de cliente en repos públicos. Lenguajes: Python 89.1%, HTML 6.7%, JavaScript 4.1%">
