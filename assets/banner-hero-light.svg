<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Gerardo Barrera — construyo sistemas que verifican y que declaran lo que no saben">
  <defs>
    <pattern id="gridL" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#E6EAEF" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6F8FA" stop-opacity="0"/>
      <stop offset="70%" stop-color="#F6F8FA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F6F8FA" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="typeClipL">
      <rect x="140" y="236" width="0" height="34">
        <animate attributeName="width"
                 values="0;675;675;0;0"
                 keyTimes="0;0.32;0.965;0.97;1"
                 dur="11s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1280" height="330" fill="#F6F8FA"/>
  <rect width="1280" height="330" fill="url(#gridL)"/>
  <rect width="1280" height="330" fill="url(#fadeL)"/>

  <g>
    <rect x="72" y="58"  width="6" height="46" rx="3" fill="#D1383D"/>
    <rect x="72" y="110" width="6" height="46" rx="3" fill="#D98A0B"/>
    <rect x="72" y="162" width="6" height="46" rx="3" fill="#7C8896"/>
    <rect x="72" y="214" width="6" height="46" rx="3" fill="#1F8A55"/>
  </g>

  <text x="110" y="106" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" fill="#1F2328" letter-spacing="4">
    <tspan font-weight="200">GERARDO</tspan><tspan font-weight="700" dx="14">BARRERA</tspan>
  </text>

  <text x="112" y="146" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#57606A" letter-spacing="0.4">
    Construyo sistemas que verifican <tspan fill="#8C959F">—</tspan> y que declaran lo que no saben.
  </text>

  <text x="112" y="180" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="14" fill="#8C959F" letter-spacing="2.6">
    PYTHON · PIPELINE DETERMINISTA · IA ACOTADA POR CÓDIGO
  </text>

  <rect x="110" y="206" width="762" height="72" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
  <circle cx="132" cy="224" r="4" fill="#D1383D" opacity="0.75"/>
  <circle cx="146" cy="224" r="4" fill="#D98A0B" opacity="0.75"/>
  <circle cx="160" cy="224" r="4" fill="#1F8A55" opacity="0.75"/>

  <g clip-path="url(#typeClipL)">
    <text x="140" y="258" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="17" xml:space="preserve">
      <tspan fill="#1F8A55">&#8250; </tspan><tspan fill="#24292F">imagen_oscura: </tspan><tspan fill="#D1383D" font-weight="700">GRAVE</tspan><tspan fill="#24292F"> — brillo=</tspan><tspan fill="#B87503">31</tspan><tspan fill="#6E7781"> (mínimo: 40) </tspan><tspan fill="#24292F">— fuente: </tspan><tspan fill="#1F8A55" font-weight="700">CODIGO</tspan>
    </text>
  </g>

  <rect y="240" width="9" height="22" fill="#1F8A55">
    <animate attributeName="x"
             values="140;805;805;140;140"
             keyTimes="0;0.32;0.965;0.97;1"
             dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="1170" y="300" text-anchor="end" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="12" fill="#AFB8C1" letter-spacing="1.6">
    EL CÓDIGO DECIDE · EL MODELO INTERPRETA
  </text>
</svg>
